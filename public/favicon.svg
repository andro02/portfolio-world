<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0ea" />
      <stop offset="1" stop-color="#2f9fc4" />
    </linearGradient>
  </defs>

  <!-- sea -->
  <rect width="64" height="64" rx="15" fill="url(#sea)" />

  <!-- the island, scaled up so it stays readable at 16 px -->
  <g transform="translate(32 33) scale(1.32) translate(-32.5 -36)">
    <!-- foam around the island -->
    <path d="M9 38 18 27 33 23 48 26 56 36 50 46 33 50 16 47Z" fill="#fff" opacity=".45" />
    <!-- sand -->
    <path d="M12 37 20 28 33 25 46 27 53 36 48 44 33 47 18 45Z" fill="#f2d49b" />
    <!-- grass, two shades for a low-poly look -->
    <path d="M18 35 24 29 33 27 43 29 48 35 42 40 30 41 21 40Z" fill="#8cc152" />
    <path d="M33 27 43 29 48 35 42 40 33 35Z" fill="#74a843" />
    <!-- the player -->
    <rect x="29" y="22" width="7" height="13" rx="3.5" fill="#f2a65a" />
    <rect x="29" y="22" width="3.5" height="13" rx="1.75" fill="#d9883d" opacity=".55" />
  </g>
</svg>
